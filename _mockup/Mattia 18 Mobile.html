<html lang="it">
<head>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          heading: ["'Instrument Serif'", "serif"],
          body: ["'Barlow'", "sans-serif"],
        },
        colors: {
          paper: "#F5EFE3",
          "paper-soft": "#EDE4D2",
          "paper-deep": "#E5DAC4",
          wine: "#7A1E2B",
          "wine-deep": "#5C1620",
          ink: "#1C1410",

<style>
  :root {
    --paper: #F5EFE3;
    --paper-soft: #EDE4D2;
    --paper-deep: #E5DAC4;
    --wine: #7A1E2B;
    --wine-deep: #5C1620;
    --wine-faint: rgba(122,30,43,0.08);
    --ink: #1C1410;
    --ink-soft: #5A4E45;
    --line: rgba(28,20,16,0.10);
  }
  html, body { background: #E8E4DA; }
  body { font-family: 'Barlow', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  .paper-card {
    background: rgba(237,228,210,0.7);
    border: 1px solid rgba(28,20,16,0.08);
    box-shadow: 0 1px 2px rgba(122,30,43,0.05);
    position: relative;
    overflow: hidden;
  }
  .paper-card::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.55) 0%,
      rgba(255,255,255,0.18) 25%,
      rgba(255,255,255,0) 50%,
      rgba(28,20,16,0.04) 75%,
      rgba(28,20,16,0.10) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }
  .paper-card-strong {
    background: var(--paper-soft);
    border: 1px solid rgba(28,20,16,0.12);
    box-shadow: 0 8px 24px rgba(122,30,43,0.10), 0 2px 4px rgba(28,20,16,0.06), inset 0 1px 0 rgba(255,255,255,0.55);
    position: relative;
    overflow: hidden;
  }
  .paper-card-strong::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.70) 0%,
      rgba(255,255,255,0.25) 25%,
      rgba(255,255,255,0) 50%,
      rgba(28,20,16,0.08) 75%,
      rgba(28,20,16,0.18) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Headline override for BlurText paragraph on hero */
  .hero-headline p,
  p.hero-headline {
    font-size: 64px !important;
    line-height: 0.82 !important;
    letter-spacing: -3px !important;
  }
  .empty-headline p,
  p.empty-headline {
    font-size: 40px !important;
    line-height: 0.85 !important;
    letter-spacing: -1.5px !important;
  }

  /* ===== DomeGallery (React Bits) ===== */
  body.dg-scroll-lock { overflow: hidden; }
  .sphere-root {
    position: relative;
    width: 100%;
    height: 100%;
    --radius: 520px;
    --viewer-pad: 72px;
    --circ: calc(var(--radius) * 3.14);
    --rot-y: calc((360deg / var(--segments-x)) / 2);
    --rot-x: calc((360deg / var(--segments-y)) / 2);
    --item-width: calc(var(--circ) / var(--segments-x));
    --item-height: calc(var(--circ) / var(--segments-y));
    transition: z-index 0s;
  }
  .sphere-root[data-enlarging="true"] {
    z-index: 60;
  }
  .sphere-root * { box-sizing: border-box; }
  .sphere, .item, .item__image { transform-style: preserve-3d; }
  main.sphere-main {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    background: transparent;
  }
  .stage {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    perspective: calc(var(--radius) * 2);
    perspective-origin: 50% 50%;
    contain: layout paint size;
  }
  .sphere { transform: translateZ(calc(var(--radius) * -1)); will-change: transform; }
  .overlay, .overlay--blur {
    position: absolute; inset: 0; margin: auto;
    z-index: 3; pointer-events: none;
  }
  .overlay {
    background-image: radial-gradient(rgba(235, 235, 235, 0) 65%, var(--overlay-blur-color, #120F17) 100%);
  }
  .overlay--blur {
    -webkit-mask-image: radial-gradient(rgba(235, 235, 235, 0) 70%, var(--overlay-blur-color, #120F17) 90%);
            mask-image: radial-gradient(rgba(235, 235, 235, 0) 70%, var(--overlay-blur-color, #120F17) 90%);
    backdrop-filter: blur(3px);
  }
  .item {
    width: calc(var(--item-width) * var(--item-size-x));
    height: calc(var(--item-height) * var(--item-size-y));
    position: absolute;
    top: -999px; bottom: -999px; left: -999px; right: -999px;
    margin: auto;
    transform-origin: 50% 50%;
    backface-visibility: hidden;
    transition: transform 300ms;
    transform:
      rotateY(calc(var(--rot-y) * (var(--offset-x) + ((var(--item-size-x) - 1) / 2)) + var(--rot-y-delta, 0deg)))
      rotateX(calc(var(--rot-x) * (var(--offset-y) - ((var(--item-size-y) - 1) / 2)) + var(--rot-x-delta, 0deg)))
      translateZ(var(--radius));
  }
  .item__image {
    position: absolute; display: block;
    inset: 6px;
    border-radius: var(--tile-radius, 12px);
    background: transparent;
    overflow: hidden;
    backface-visibility: hidden;
    transition: transform 300ms;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    pointer-events: auto;
    -webkit-transform: translateZ(0);
            transform: translateZ(0);
  }
  .item__image:focus { outline: none; }
  .item__image img {
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    backface-visibility: hidden;
    filter: var(--image-filter, none);
  }
  .item__image--placeholder {
    background: var(--placeholder-color, #7A1E2B);
    display: flex; align-items: center; justify-content: center;
  }
  .item__image--placeholder .item__placeholder-mark {
    width: 22%; height: 22%;
    border-radius: 999px;
    background: rgba(245,239,227,0.12);
    box-shadow: inset 0 0 0 1px rgba(245,239,227,0.18);
  }
  .viewer .enlarge--placeholder {
    background: var(--placeholder-color, #7A1E2B);
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .viewer .enlarge__placeholder-inner {
    padding: 28px 22px;
    color: #F5EFE3;
    max-width: 240px;
  }
  .viewer .enlarge__placeholder-title {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 22px;
    line-height: 1.08;
    letter-spacing: -0.3px;
    margin-bottom: 10px;
  }
  .viewer .enlarge__placeholder-body {
    font-family: 'Barlow', sans-serif;
    font-size: 12.5px;
    line-height: 1.4;
    color: rgba(245,239,227,0.78);
  }
  .viewer {
    position: absolute; inset: 0;
    z-index: 20;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--viewer-pad);
  }
  .viewer .frame {
    width: 240px;
    height: 320px;
    max-width: 100%;
    max-height: 100%;
    border-radius: var(--enlarge-radius, 32px);
    display: flex;
  }
  .viewer .scrim {
    position: absolute; inset: 0;
    z-index: 10;
    background: rgba(0, 0, 0, 0.4);
    pointer-events: none;
    opacity: 0;
    transition: opacity 500ms ease;
    backdrop-filter: blur(3px);
  }
  .sphere-root[data-enlarging='true'] .viewer .scrim {
    opacity: 1; pointer-events: all;
  }
  .viewer .enlarge {
    position: absolute; z-index: 30;
    border-radius: var(--enlarge-radius, 32px);
    overflow: hidden;
    transition: transform 500ms ease, opacity 500ms ease;
    transform-origin: top left;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45), 0 -8px 30px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.04);
  }
  .viewer .enlarge img { width: 100%; height: 100%; object-fit: cover; filter: var(--image-filter, none); }
  .viewer .enlarge-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 18px 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.78) 100%);
    color: #F5EFE3;
    text-align: left;
    pointer-events: none;
  }
  .viewer .enlarge-caption__text {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 18px;
    line-height: 1.15;
    letter-spacing: -0.2px;
    color: #F5EFE3;
  }
  .viewer .enlarge-caption__name {
    margin-top: 4px;
    font-family: 'Barlow', sans-serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: rgba(245,239,227,0.72);
  }
  @keyframes enlargeCaptionIn { to { opacity: 1; transform: translateY(0); } }
  .sphere-root .enlarge-closing img { filter: var(--image-filter, none); }
  .edge-fade {
    position: absolute; left: 0; right: 0;
    height: 120px;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent, var(--overlay-blur-color, #120F17));
  }
  .edge-fade--top { top: 0; transform: rotate(180deg); }
  .edge-fade--bottom { bottom: 0; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Suppress noisy framer-motion key warnings in dev -->
<script>
  (function() {
    const _err = console.error;
    console.error = function(...args) {
      const msg = args[0];
      if (typeof msg === "string" && (msg.includes("Each child in a list") || msg.includes("unique \"key\""))) return;
      return _err.apply(console, args);
    };
  })();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
<script>window.Motion = window.Motion || window.FramerMotion || window.motion;</script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="dome-gallery.jsx"></script>
<script type="text/babel" src="states.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  const STATES = [
    { id: "splash", label: "Splash" },
    { id: "hero", label: "Hero" },
    { id: "galleria", label: "Galleria" },
    { id: "galleria-sparse", label: "Pochi" },
    { id: "galleria-piena", label: "Tanti" },
    { id: "lightbox", label: "Lightbox" },
    { id: "upload-1", label: "Upload 1" },
    { id: "upload-2", label: "Upload 2" },
    { id: "success", label: "Success" },
    { id: "empty", label: "Empty" },
    { id: "error", label: "Error" },
  ];

  function App() {
    const [activeView, setActiveView] = useState("splash");
    const [splashKey, setSplashKey] = useState(0);

    const handleSetView = (id) => {
      if (id === "splash") setSplashKey((k) => k + 1);
      setActiveView(id);
    };

    const renderState = () => {
      // triggerKey re-mounts BlurText when switching to/from hero or empty
      switch (activeView) {
        case "splash":
          return (
            <window.SplashView
              key={splashKey}
              onEnter={() => setActiveView("hero")}
            />
          );
        case "hero":
          return <window.HeroView triggerKey={activeView} />;
        case "galleria":
          return <window.GalleriaView />;
        case "galleria-sparse":
          return <window.GalleriaSparseView />;
        case "galleria-piena":
          return <window.GalleriaPienaView />;
        case "lightbox":
          return <window.LightboxView />;
        case "upload-1":
          return <window.Upload1View />;
        case "upload-2":
          return <window.Upload2View />;
        case "success":
          return <window.SuccessView />;
        case "empty":
          return <window.EmptyView triggerKey={activeView} />;
        case "error":
          return <window.ErrorView />;
        default:
          return null;
      }
    };

    return (
      <div className="min-h-screen w-full" data-screen-label={`Mattia 18 — ${activeView}`}>
        {/* Harness */}
        <div className="max-w-md mx-auto pt-6 pb-2 px-4">
          <div
            className="text-[11px] uppercase text-ink-soft mb-3 font-body"
            style={{ letterSpacing: "0.15em" }}
          >
            Mattia fa 18 · mobile mockup
          </div>
          <div className="flex flex-wrap gap-1.5 mb-6">
            {STATES.map((s) => {
              const isActive = activeView === s.id;
              return (
                <button
                  key={s.id}
                  onClick={() => handleSetView(s.id)}
                  className={
                    "paper-card rounded-full px-3 py-1.5 text-[11px] font-body font-medium whitespace-nowrap cursor-pointer active:scale-95 transition-transform " +
                    (isActive ? "text-paper" : "text-ink")
                  }
                  style={
                    isActive
                      ? { background: "var(--wine)", borderColor: "var(--wine)" }
                      : undefined
                  }
                >
                  {s.label}
                </button>
              );
            })}
          </div>
        </div>

        {/* Device frame */}
        <div
          className="mx-auto"
          style={{
            background: "#1C1410",
            padding: 10,
            borderRadius: "2.75rem",
            width: 410,
            boxShadow: "0 30px 80px rgba(122,30,43,0.18)",
          }}
        >
          <div
            className="relative bg-paper overflow-hidden"
            style={{
              width: 390,
              height: 844,
              borderRadius: "2.25rem",
            }}
          >
            {renderState()}
          </div>
        </div>

        <div className="h-10" />
      </div>
    );
  }

  // Inject hero headline class on the BlurText paragraph after mount
  // (BlurText accepts className; we already pass big-size classes via Tailwind text-[64px] in HeroView)

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
